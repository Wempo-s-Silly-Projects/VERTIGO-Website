name: CI

on:
  pull_request:
  push:
    branches: [main, cloudflare-platform-consolidated]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Build Container image
        run: docker build --platform linux/amd64 --tag vertexia-ci .

  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Generate Worker types
        run: pnpm types
      - name: Typecheck
        run: pnpm check
      - name: Build Worker bundle (dry run)
        run: pnpm exec wrangler deploy --dry-run
      - name: Export generated lockfile for commit
        run: |
          base64 -w0 pnpm-lock.yaml | fold -w 8000 | sed 's/^/LOCKFILE_B64:/'
